modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/yucktheslime/a-trade-of-immersion/issues"

[[mods]]
modId = "tradeofimmersion"
version = "${version}"
displayName = "A Trade of Immersion"
authors = "yucktheslime"
description = '''
AI companions for MCA Reborn: a player-like NPC with a real inventory that uses any mod's items, rides horses, boats and modded mounts, fights, remembers what happens around it, learns items and talks with MCA villagers. Runs on a free local LLM (Ollama) or any OpenAI-compatible API (OpenRouter), or a Kagrenac server.
'''

# MCA Body Shapes (by yucktheslime, MIT) ships in this jar as a second mod with its original mod id, so its
# saved body_shape attachments and config/mcabodyshapes-*.toml files keep loading. NeoForge only.
[[mods]]
modId = "mcabodyshapes"
version = "${body_shapes_version}"
displayName = "MCA Body Shapes"
authors = "yucktheslime"
description = '''
Adds saved body-shape sliders, clothed seat geometry with optional bounce, and a pregnancy belly to MCA Reborn villagers.
Clothed body proportions only. This add-on is strictly non-explicit. Bundled with A Trade of Immersion, whose pregnancy phases drive the belly.
'''

# MCA Reborn villager editor, needle and comb on companions (common mixins).
[[mixins]]
config = "tradeofimmersion.mixins.json"

# Phase 2 "MCA life": pregnancy phases, gifts, companion romance (MCA and own-class hooks).
[[mixins]]
config = "tradeofimmersion.life.mixins.json"

# Phase 3: record serverbound custom payloads for key-press learning.
[[mixins]]
config = "tradeofimmersion.skills.mixins.json"

# Optional client compat with "MCA: Female Gender Physics" (mcabp); a mixin plugin skips it when that mod is absent.
[[mixins]]
config = "tradeofimmersion.mcabp.mixins.json"

# Fix for "MCA: Cobblemon" 1.0.1 crashing on MCA 7.7.36 (gifting a Poke Ball); skipped when that mod is absent.
[[mixins]]
config = "tradeofimmersion.mcacobblemon.mixins.json"

# MCA Body Shapes: Shape tab in MCA's editor, villager/player model shaping and the belly mesh (client only).
[[mixins]]
config = "mcabodyshapes.mixins.json"

[[dependencies.tradeofimmersion]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Architectury API is nested in this jar (Jar-in-Jar). Players do not need a
# separate install. A standalone Architectury API 13.0.8 or newer is also fine.
[[dependencies.tradeofimmersion]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "mca"
type = "required"
versionRange = "[7.7,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "mcabp"
type = "optional"
versionRange = "[0.1.8,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mcabodyshapes]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcabodyshapes]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcabodyshapes]]
modId = "mca"
type = "required"
versionRange = "[7.7,8.0)"
ordering = "AFTER"
side = "BOTH"

# The belly reads A Trade of Immersion's pregnancy phases (same jar).
[[dependencies.mcabodyshapes]]
modId = "tradeofimmersion"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# MCA: Female Gender Physics, optional: breast gene stays at 0 (no double bust); TOI still jiggles its own bust mesh.
[[dependencies.mcabodyshapes]]
modId = "mcabp"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# MCA Expressions, optional: body-part scales are applied after setupAnim so its animations keep their motion.
[[dependencies.mcabodyshapes]]
modId = "mcaexpressions"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
