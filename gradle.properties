# Gradle properties for A Trade of Immersion
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version=0.3.9
maven_group=dev.yucktheslime
archives_name=a-trade-of-immersion
mod_id=tradeofimmersion
# NeoForge is the primary target; Fabric is kept as a secondary build.
enabled_platforms=fabric,neoforge

# Minecraft
minecraft_version=1.21.1

# Loaders / APIs (resolved Nov 2026 from maven.neoforged.net, maven.fabricmc.net,
# meta.fabricmc.net and maven.architectury.dev)
neoforge_version=21.1.267
fabric_loader_version=0.17.2
fabric_api_version=0.116.18+1.21.1
# Architectury API: used for loader-agnostic events/config dir.
# Bundled into the NeoForge and Fabric jars (jar-in-jar / Loom include) so players
# do not install it separately. A standalone 13.0.8+ copy in mods/ is also fine.
architectury_api_version=13.0.8

# Mod dependencies from the Modrinth Maven: maven.modrinth:<slug>:<version-id>.
# Version ids are used because the Fabric and NeoForge files share a version number.
# MCA Reborn 7.7.36+1.21.1 (files mca-<loader>-7.7.36-beta.3+1.21.1.jar)
mca_neoforge_version=S2Ln2tIn
mca_fabric_version=eUYBilCG

# MCA: Female Gender Physics (CurseForge 1710127), NeoForge 1.21.1 V0.1.8 - optional soft dependency
mcabp_neoforge_file=9434332
