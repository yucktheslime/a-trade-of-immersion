name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Server voice tests (PocketTTS stub)
        run: php kagrenac-server/tests/tts_test.php

      - name: Server Minime and TXT2VEC tests (local stub)
        run: php kagrenac-server/scripts/test_minime_txt2vec.php

      - name: Server plugin tests
        run: php kagrenac-server/tests/plugins_test.php

      - name: Server NPC voice tests (PocketTTS stub)
        run: php kagrenac-server/tests/npc_voices_test.php

      - name: Server speech-to-text tests (Parakeet / faster-whisper / whisper.cpp stubs)
        run: php kagrenac-server/tests/stt_test.php

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      # Only the remapped, runnable jars (not -dev-shadow / -sources).
      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: a-trade-of-immersion-neoforge-1.21.1
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev-shadow.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: a-trade-of-immersion-fabric-1.21.1
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev-shadow.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error
