name: Sync server repository

# Keeps https://github.com/yucktheslime/toi-kagrenac-server (the repository the DwemerDistro launcher lists)
# equal to `git subtree split --prefix=kagrenac-server` of main. Fast-forward pushes only, never forced.
# Needs the repository secret SERVER_REPO_DEPLOY_KEY: the private half of a write deploy key of the server
# repository. Without it the job only prints a notice; run tools/release_server.sh sync locally instead.

on:
  push:
    branches: [main]
    paths: ["kagrenac-server/**"]
  workflow_dispatch:

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split and push
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::SERVER_REPO_DEPLOY_KEY is not set; skipping. Run tools/release_server.sh sync locally."
            exit 0
          fi
          sha="$(git subtree split --prefix=kagrenac-server HEAD | tail -n1)"
          echo "server commit $sha"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/server_repo
          chmod 600 ~/.ssh/server_repo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/server_repo -o IdentitiesOnly=yes" \
            git push git@github.com:yucktheslime/toi-kagrenac-server.git "$sha:refs/heads/main"
