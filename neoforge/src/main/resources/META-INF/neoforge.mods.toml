modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/yucktheslime/a-trade-of-immersion/issues"

[[mods]]
modId = "tradeofimmersion"
version = "${version}"
displayName = "A Trade of Immersion"
authors = "yucktheslime"
description = '''
AI companions for MCA Reborn: a player-like NPC with a real inventory that uses any mod's items, rides horses, boats and modded mounts, fights, remembers what happens around it, learns items and talks with MCA villagers. Runs on a free local LLM (Ollama) or any OpenAI-compatible API (OpenRouter), or a Kagrenac server.
'''

# MCA Reborn villager editor, needle and comb on companions (common mixins).
[[mixins]]
config = "tradeofimmersion.mixins.json"

# Optional client compat with "MCA: Female Gender Physics" (mcabp); a mixin plugin skips it when that mod is absent.
[[mixins]]
config = "tradeofimmersion.mcabp.mixins.json"

[[dependencies.tradeofimmersion]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "mca"
type = "required"
versionRange = "[7.7,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tradeofimmersion]]
modId = "mcabp"
type = "optional"
versionRange = "[0.1.8,)"
ordering = "NONE"
side = "CLIENT"
