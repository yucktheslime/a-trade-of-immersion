# Gradle properties for MCA-Player2 Bridge
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version=0.1.0
maven_group=dev.yucktheslime
archives_base_name=mca-player2-bridge

# Minecraft / Fabric (resolved Nov 2026 from meta.fabricmc.net and maven.fabricmc.net)
minecraft_version=1.21.1
loader_version=0.17.2
fabric_version=0.116.18+1.21.1
# Architectury API is a hard dependency of PlayerEngine / Player2NPC (>=13.0.8); not used by our code.
architectury_version=13.0.8

# Mod dependencies from the Modrinth Maven: maven.modrinth:<slug>:<version-id>.
# Version ids are used because the Fabric and NeoForge files share a version number.
# MCA Reborn 7.7.36+1.21.1 Fabric (file mca-fabric-7.7.36-beta.3+1.21.1.jar)
mca_version=eUYBilCG
# PlayerEngine 1.21.1-1.4.0-Fabric
playerengine_version=msqQbeg3
# Player2NPC 1.21.1-1.4.0-Fabric (dev runtime only; provides the companion entity + UI)
player2npc_version=QcQZkwnO
