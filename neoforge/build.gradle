plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    // Compile/runtime in dev; also nest the same jar so players do not need a
    // separate Architectury API install. A standalone 13.0.8+ copy still works
    // (NeoForge Jar-in-Jar picks one version).
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    include "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    modImplementation "maven.modrinth:minecraft-comes-alive-reborn:${rootProject.mca_neoforge_version}"

    // Optional soft dependency: "MCA: Female Gender Physics" (mod id mcabp). Compile-only + dev runtime;
    // all code touching it is behind ModList checks / a mixin plugin, so it is never required.
    modCompileOnly "curse.maven:mca-female-gender-physics-1710127:${rootProject.mcabp_neoforge_file}"
    if (!project.hasProperty("noMcabp")) { // ./gradlew :neoforge:runClient -PnoMcabp tests without the addon
        modLocalRuntime "curse.maven:mca-female-gender-physics-1710127:${rootProject.mcabp_neoforge_file}"
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    def expandProps = [version: project.version, body_shapes_version: rootProject.body_shapes_version]
    inputs.properties expandProps
    filesMatching("META-INF/neoforge.mods.toml") {
        expand expandProps
    }
}

// MCA Body Shapes' dev screenshot runner (package devshot and its test skin) is never part of this repo,
// but keep it out of every jar even if a local copy is dropped into the source tree for screenshots.
tasks.withType(AbstractArchiveTask).configureEach {
    exclude "dev/yucktheslime/mcabodyshapes/devshot/**"
    exclude "assets/mcabodyshapes/skins/devshot/**"
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
